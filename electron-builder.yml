appId: com.vellum.quicknote
productName: Vellum
copyright: Copyright © 2026 Vellum
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
  # Tray icons are loaded at runtime from <app>/resources/.
  - resources/tray*.png
  - '!**/*.map'
asar: true
# Without a Developer ID certificate electron-builder skips signing, and an
# unsigned bundle does not start on Apple silicon ("is damaged"). This
# applies an ad-hoc signature when no certificate is available.
afterPack: scripts/sign-macos.js
extraResources:
  # Third-party notice for the Muya editor (MarkText, MIT).
  - from: vendor/muya/LICENSE
    to: licenses/muya-marktext-LICENSE.txt
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  icon: resources/icon.png
  # Fixed artifact names so the landing page download link
  # (releases/latest/download/Vellum-arm64.dmg) never has to change.
  artifactName: Vellum-${arch}.${ext}
  extendInfo:
    NSHighResolutionCapable: true
    LSUIElement: false
    NSSupportsAutomaticGraphicsSwitching: true
win:
  target:
    - nsis
  icon: resources/icon.ico
  # Fixed names so the landing page links never have to change.
  artifactName: Vellum-Setup-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: resources/icon-512.png
  artifactName: Vellum-${arch}.${ext}
  desktop:
    entry:
      StartupWMClass: Vellum
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Vellum Quick Note
